apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-model-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: churn-model-service
  template:
    metadata:
      labels:
        app: churn-model-service
    spec:
      containers:
      - name: churn-model-service
        image: churncontenair.azurecr.io/churn-model-service:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      imagePullSecrets:
      - name: acr-secret
