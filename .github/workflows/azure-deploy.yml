name: Deploy to Azure AKS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.REGISTRY_NAME }}.azurecr.io
      AKS_CLUSTER: ${{ secrets.AKS_CLUSTER_NAME }}
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.REGISTRY_NAME }}

      # Build and push backend
      - name: Build and push backend image
        run: |
          docker build -t $REGISTRY/backend:latest ./backend
          docker push $REGISTRY/backend:latest

      # Build and push churn-model-service
      - name: Build and push churn-model-service image
        run: |
          docker build -t $REGISTRY/churn-model-service:latest ./churn_model_service
          docker push $REGISTRY/churn-model-service:latest

      # Build and push recommendation-service
      - name: Build and push recommendation-service image
        run: |
          docker build -t $REGISTRY/recommendation-service:latest ./recommendation_service
          docker push $REGISTRY/recommendation-service:latest

      # Build and push sentiment-service
      - name: Build and push sentiment-service image
        run: |
          docker build -t $REGISTRY/sentiment-service:latest ./sentiment_service
          docker push $REGISTRY/sentiment-service:latest
      
      # Build and push ai_generator-service
      - name: Build and push ai_generator-service image
        run: |
          docker build -t $REGISTRY/ai-generator-service:latest ./ai-generator
          docker push $REGISTRY/ai-generator-service:latest

      # Build and push frontend
      - name: Build and push frontend image
        run: |
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > ./frontend/.env
          docker build -t $REGISTRY/frontend:latest ./frontend
          docker push $REGISTRY/frontend:latest

      # Get AKS credentials
      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      # Deploy to AKS
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Check Pods status
        run: |
          kubectl get pods -A
